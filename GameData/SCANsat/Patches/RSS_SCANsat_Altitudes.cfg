// SCANsat Real Solar System (RSS) realistic altitude scaling patch
// Automatically scales scanner operating altitudes to true Earth orbits when RSS is installed.

// -------------------------------------------------------------
// 1. GEO / Geostationary Meteorological & Earth Observation Satellites
// Real Earth GEO Altitude: ~35,786 km
// -------------------------------------------------------------

@PART[scansat-met-fy4-agri]:NEEDS[RealSolarSystem]
{
	@MODULE[SCANsat]
	{
		@min_alt = 15000000
		@best_alt = 30000000
		@max_alt = 45000000
	}
}

