// SCANweather ModuleManager patch
// Attaches live meteorological & KWP space weather telemetry to all meteorological satellites

@PART[scansat-met-fy4-agri|scansat-multi-abi-1]:FOR[SCANsat]
{
	MODULE
	{
		name = SCANweather
		weatherCapabilities = 综合多通道云系与辐射观测 (全通道)
		updateInterval = 2.0
	}
}

@PART[scansat-met-fy4-giirs|scansat-met-meteor-ikfs|scansat-met-metop-iasi]:FOR[SCANsat]
{
	MODULE
	{
		name = SCANweather
		weatherCapabilities = 红外高光谱大气垂直探测 (温湿水汽廓线)
		updateInterval = 2.5
	}
}

@PART[scansat-met-fy3-mersi|scansat-met-meteor-msu]:FOR[SCANsat]
{
	MODULE
	{
		name = SCANweather
		weatherCapabilities = 极轨宽幅多光谱云系成像
		updateInterval = 2.0
	}
}

@PART[scansat-met-fy3-pmr]:FOR[SCANsat]
{
	MODULE
	{
		name = SCANweather
		weatherCapabilities = 双频微波主动降水测量雷达 (降水速率与云中水)
		updateInterval = 1.5
	}
}

@PART[scansat-met-metop-ascat]:FOR[SCANsat]
{
	MODULE
	{
		name = SCANweather
		weatherCapabilities = C波段微波散射计 (10米海面风速与风向场)
		updateInterval = 1.5
	}
}

@PART[scansat-met-metop-avhrr]:FOR[SCANsat]
{
	MODULE
	{
		name = SCANweather
		weatherCapabilities = 先进超高分辨率多光谱辐射 (海温与植被指数)
		updateInterval = 2.0
	}
}
