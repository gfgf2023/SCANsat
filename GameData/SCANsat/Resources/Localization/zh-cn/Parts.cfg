Localization
{
	zh-cn
	{
		#autoLOC_SCANsat_BTDT_Title			= SCAN BTDT 系统(Been There Done That®)
		#autoLOC_SCANsat_BTDT_Description		= 这个小的传感器能自动识别附近的异常，就算它只在非常短的距离内和非常低的高度上工作，可用于跟踪已识别的异常点，非常有用。

		#autoLOC_SCANsat_BTDT_Exo_Description 		= This model of scanning device contains a set of passive and active sensors designed to quickly hone in on interesting features located nearby. 
		
		#autoLOC_SCANsat_Multi_Title			= SCAN 多光谱传感器
		#autoLOC_SCANsat_Multi_Description		= 这个多谱段传感器检测到的辐射包括了红外波段,可见光波段与雷达波段，这给了它区分地形类型和生物群系的能力。它也可以用于扫描异常点，比如地表特殊结构。

		#autoLOC_SCANsat_Radar_Title			= SCAN 雷达测高传感器
		#autoLOC_SCANsat_Radar_Description		= SCAN给你带来高性能雷达测高传感器。它是这个传感器家族的入门型，通常和玩具火箭、遥控飞机模型捆绑销售。研究小组经研究得知95%的目标受众尝试用胶带把它粘到火箭排气口上，这种改进似乎使之更容易使用。

		#autoLOC_SCANsat_SAR_Title			= SCAN 合成孔径雷达测高传感器
		#autoLOC_SCANsat_SAR_Description		= 这种合成孔径雷达测高传感器使用它的飞行路径来模拟一个更大的天线，这使得其可以使用更高的分辨率扫描地形，缺点是视野比较小，并且它在更高的地方才能获得最佳工作状态。
	
		#autoLOC_SCANsat_Radar3B_Title				= R-3B 雷达高度计
		#autoLOC_SCANsat_Radar3B_Description	= 这款高精度雷达高度计可以在小范围内收集基本的高度数据，无论有无光照均在合理的功率内可以稳定工作。
		
		#autoLOC_SCANsat_RadarEO_Title				= R-EO-1 高度雷达
		#autoLOC_SCANsat_RadarEO_Description	= 这款入门级 L 波段雷达高度计可从较低轨道收集中等宽度的低分辨率高度数据。 无论有无光照均在合理的功率内可以稳定工作。
	
		#autoLOC_SCANsat_SARX_Title				= SAR-X 天线
		#autoLOC_SCANsat_SARX_Description	= 这是一款初级合成孔径雷达, 这是一款初级合成孔径雷达, 这款雷达可以主动发出信号并利用卫星的移动来接受合成反射回来的信号，这款雷达需要卫星运行于低轨，并且信号较窄。耗能巨大，但不受光源限制。
		
		#autoLOC_SCANsat_SARC_Title				=  SAR-C 天线
		#autoLOC_SCANsat_SARC_Description	= 这是一款高级合成孔径雷达设备, 通过增加雷达的功率，其相较 SAR-X 拥有更大的扫描范围，并且可以运行在更高的轨道之上，不过这款雷达对卫星轨道更为敏感。SAR-C 也和其初级版本一样，耗能巨大，不受光源限制。
		
		#autoLOC_SCANsat_SARL_Title				= SAR-L 天线
		#autoLOC_SCANsat_SARL_Description	= 目前为止最为先进的合成孔径雷达设备, 看它的体积就知道了。这款雷达天线可以从更高的轨道上绘制大片地形信息，甚至还包括了目标的群落地图。警告：使用前请备好足够能源。

		#autoLOC_SCANsat_Multi_MS1_Title					= MS-1 多光谱扫描仪
		#autoLOC_SCANsat_Multi_MS1_Description		= 这种低分辨率多光谱扫描仪收集目标表面反射的光，以提供低细节的颜色和生物群落地图。 因为是系列扫描仪的入门版本, 它只能在低轨运行, 并且无法探测任何资源信息。注意：需使用少量能源，仅能在有阳光时工作。
		
		#autoLOC_SCANsat_Multi_MSR_Title					= MS-R 增强型多光谱扫描仪
		#autoLOC_SCANsat_Multi_MSR_Description		= MS-R 增强型多光谱扫描仪是真正的多面手, 通过搜集从行星表面反射的光，其可以提供低细节的彩色地图和生物群落地图，甚至还包括一些地表资源。与入门级产品相比，MS-R 增强型多光谱扫描仪允许在更高的轨道上有效运行, 但是只能扫描很窄的范围。注意：需使用少量能源，仅能在有阳光时工作。
		
		#autoLOC_SCANsat_Multi_MS2A_Title				= MS-2A 先进多光谱扫描仪
		#autoLOC_SCANsat_Multi_MS2A_Description	= 通过检查多个光谱通道中的光波长，MS-2A 先进多光谱扫描仪可以同时生成目标低精度的彩色地图, 群落地图和资源分布。注意：需使用少量能源，仅能在有阳光时工作。
	
		#autoLOC_SCANsat_VS1_Title			= VS-1 高分辨率成像仪
		#autoLOC_SCANsat_VS1_Description	= 这款入门级高分辨率成像仪可以生产出精度上佳的高清晰彩色地图。当然，仅限低轨运转。注意：需使用少量能源，仅能在有阳光时工作。
	
		#autoLOC_SCANsat_VS3_Title			= VS-3 先进高分辨率成像仪
		#autoLOC_SCANsat_VS3_Description = 民用级高精度成像仪的巅峰之作, 这种大型且昂贵的成像仪可生成高细节的彩色图像，并且可以识别独特的地表特征。注意：需使用少量能源，仅能在有阳光时工作。
	
		#autoLOC_SCANsat_VS11_Title			= VS-11 绝密侦察成像仪
		#autoLOC_SCANsat_VS11_Description = *REDACTED* 可以从 *REDACTED* 到 *REDACTED* 的高度每隔 *REDACTED* 观察一次*REDACTED* 目标。如此惊人的 *REDACTED* 导致 *REDACTED* 推测 *REDACTED* *REDACTED*。注意：需使用适量能源，仅能在有阳光时工作。
	
		#autoLOC_SCANsat_R_Title					= SCAN-R 资源探测器
		#autoLOC_SCANsat_R_Description		= 一种入门级资源测绘仪器，在低轨道高度上运行良好，但只能扫描范围非常狭窄。注意：需使用适量能源，仅能在有阳光时工作。
	
		#autoLOC_SCANsat_R2_Title				= SCAN-R2 先进资源探测器
		#autoLOC_SCANsat_R2_Description 	= 一种先进资源探测器，可以在更高的轨道绘制资源地图。注意：需使用适量能源，仅能在有阳光时工作。
	
		#autoLOC_SCANsat_RX_Title				= SCAN-RX 高光谱资源映射器
		#autoLOC_SCANsat_RX_Description	= 目前最先进的资源成像仪，可同时捕获上百个数据通道以使其可以运转在更高的轨道的同时不失精度。注意：需使用少量能源，仅能在有阳光时工作。
	
		// -------------------------------------------------------------
		// 扩展仪器与高度调节本地化 (Instrument Expansion & Tunable Altitudes)
		// -------------------------------------------------------------
		#autoLOC_SCANsat_AltScale				= 轨道高度调节倍率
		#autoLOC_SCANsat_AltMode				= 天体适配模式
		#autoLOC_SCANsat_AltMode_Default		= 默认配置
		#autoLOC_SCANsat_AltMode_Minor			= 小天体/近距模式
		#autoLOC_SCANsat_AltMode_Medium			= 中型行星模式
		#autoLOC_SCANsat_AltMode_Giant			= 巨行星模式
		#autoLOC_SCANsat_AltMode_Auto			= 自动天体自适应

		// 风云气象卫星系列
		#autoLOC_SCANsat_FY4_AGRI_Title			= 风云四号 AGRI 静止气象辐射成像仪
		#autoLOC_SCANsat_FY4_AGRI_Description	= 参考中国风云四号气象卫星核心载荷——多通道先进静止辐射成像仪(AGRI)。专为地球同步/静止轨道(GEO)研制，具备超宽视场与高分辨率全色/多光谱成像能力，能从数万公里高空对行星整个可视圆盘实施24小时昼夜全天候连续监测，生成高清地表彩色卫星地图、云系生物群落地图与粗分辨率资源数据。
		
		#autoLOC_SCANsat_FY4_GIIRS_Title		= 风云四号 GIIRS 静止轨道干涉红外高光谱探测仪
		#autoLOC_SCANsat_FY4_GIIRS_Description	= 参考风云四号搭载的世界首台静止轨道干涉式红外大气垂直探测仪(GIIRS)。运行于静止轨道(GEO)，利用干涉傅里叶光谱技术对行星表面与大气层开展上千个通道的超精细红外高光谱探测，能够从高空精确绘制高精度地质与矿产资源分布。
		
		#autoLOC_SCANsat_FY3_MERSI_Title		= 风云三号 MERSI 中分辨率光谱成像仪
		#autoLOC_SCANsat_FY3_MERSI_Description	= 参考中国风云三号极轨气象卫星的核心光学载荷——中分辨率光谱成像仪(MERSI)。专为太阳同步极轨(SSO)设计，通过高速旋转多面体扫描镜获取极宽的扫描幅宽，在极轨飞行中能快速对整个行星实现100%全覆盖多光谱与生物群落测绘。
		
		#autoLOC_SCANsat_FY3_PMR_Title			= 风云三号G PMR 降水测量微波雷达
		#autoLOC_SCANsat_FY3_PMR_Description	= 参考风云三号G星双频主动相控阵降水测量雷达(PMR)。运行于低倾角或太阳同步低轨，利用高灵敏度微波脉冲穿透大气与云层，测定垂直降水剖面与极高精度地表高程DEM。全天候全天时工作，不受光照限制，耗电量较高。

		// 俄罗斯 Meteor-M2 系列
		#autoLOC_SCANsat_Meteor_MSU_Title		= Meteor-M2 MSU-MR 多光谱极轨扫描仪
		#autoLOC_SCANsat_Meteor_MSU_Description	= 参考俄罗斯 Meteor-M2 极轨气象卫星的多通道扫描辐射计(MSU-MR)。专为低轨与太阳同步极轨(SSO)环境打造，具备可靠的宽幅扫描能力，可提供中低精度的多光谱地表与生物群落地图，是极轨气象环境监测的得力工具。
		
		#autoLOC_SCANsat_Meteor_IKFS_Title		= Meteor-M2 IKFS-2 傅里叶红外高光谱探测仪
		#autoLOC_SCANsat_Meteor_IKFS_Description = 参考俄罗斯 Meteor-M2 先进红外傅里叶光谱仪(IKFS-2)。在极轨运行过程中测量行星地表与大气的高光谱红外辐射特征，能够高精度解算矿物成分与关键矿床资源分布。需在光照下运作。
		
		#autoLOC_SCANsat_Severjanin_Title		= Meteor-M2 Severjanin-M 侧视合成孔径雷达
		#autoLOC_SCANsat_Severjanin_Description	= 参考 Meteor-M2 极轨卫星搭载的 Severjanin-M 侧视合成孔径雷达(SAR)。专为全天候地表测绘、极地极夜冰盖监测设计，可在无光照黑暗中穿透云雾进行高精度雷达测高与生物群落地形扫描。

		// 欧洲 MetOp 系列
		#autoLOC_SCANsat_MetOp_AVHRR_Title		= MetOp AVHRR/3 先进甚高分辨率辐射计
		#autoLOC_SCANsat_MetOp_AVHRR_Description = 参考欧洲气象极轨核心星座 MetOp 的经典多光谱成像仪(AVHRR/3)。具有极高的测量稳定度与成熟度，从极轨获取涵盖可见光、近红外与热红外的多谱段地表群落与粗略资源分布。
		
		#autoLOC_SCANsat_MetOp_ASCAT_Title		= MetOp ASCAT 先进微波风场散射计
		#autoLOC_SCANsat_MetOp_ASCAT_Description = 参考欧洲空间局(ESA) MetOp 卫星的先进微波散射计(ASCAT)。利用多波束扇形天线主动发射微波脉冲，分析粗糙度与后向散射信号，可在全天候条件下绘制粗测高与群落特征。
		
		#autoLOC_SCANsat_MetOp_IASI_Title		= MetOp IASI 红外大气探测干涉仪
		#autoLOC_SCANsat_MetOp_IASI_Description	= 参考欧洲空间局超高分辨率红外大气干涉仪(IASI)，拥有8461个精细光谱通道，是目前空间高光谱遥感的代表作之一，能够极其精准地探测矿床、挥发物及大气热辐射特征。

		// 合成孔径雷达 (SAR)
		#autoLOC_SCANsat_SkyMed_Title			= COSMO-SkyMed X波段高精孔径雷达
		#autoLOC_SCANsat_SkyMed_Description		= 参考意大利 COSMO-SkyMed 星座的高分辨率 X波段合成孔径雷达。具备米级雷达几何成像与干涉测量能力，不仅能生成高精度数字高程模型(DEM)，还能从低轨与太阳同步轨道精确锁定微细地表异常点。
		
		#autoLOC_SCANsat_Sentinel1_Title		= Sentinel-1 C-SAR 先进干涉合成孔径雷达
		#autoLOC_SCANsat_Sentinel1_Description	= 参考欧洲哥白尼计划哨兵一号(Sentinel-1) C波段大型合成孔径雷达。拥有巨大的折叠展开相控阵天线，专为全天候高程地形干涉测绘(InSAR)打造，是构建行星级超精细地形与地貌高程的终极利器。

		// 地质与陆地资源系列
		#autoLOC_SCANsat_GF5_AHSI_Title			= 高分五号 AHSI 航天高光谱地质成像仪
		#autoLOC_SCANsat_GF5_AHSI_Description	= 参考中国高分五号卫星先进高光谱成像仪(AHSI)，覆盖可见光至短波红外数百个超窄光谱波段。专门用于行星矿物识别、蚀变带勘查与高精资源探测，是地质勘探的专业载荷。
		
		#autoLOC_SCANsat_Landsat_OLI_Title		= Landsat 8/9 OLI-TIRS 陆地成像与热红外传感器
		#autoLOC_SCANsat_Landsat_OLI_Description = 参考美国经典陆地卫星 Landsat 8/9 的陆地成像仪(OLI)与热红外传感器(TIRS)。集合高分辨率多光谱可见光与热红外波段，能同时输出高细节彩色图像、群落地形图以及地表资源分布。
		
		#autoLOC_SCANsat_GF4_Stare_Title		= 高分四号 静止轨道高分辨率凝视光学相机
		#autoLOC_SCANsat_GF4_Stare_Description	= 参考中国高分四号地球同步轨道遥感卫星。作为世界上分辨率最高的静止轨道光学成像系统，它可以在 36,000 公里静止轨道上对行星特定半球实施高放大倍率凝视观测，快速定位异常地质结构与地表地貌特征。

		// 全环境地外天体自适应探测仪
		#autoLOC_SCANsat_DeepSpace_Surveyor_Title = “天巡”深空地外天体全环境自适应探测仪
		#autoLOC_SCANsat_DeepSpace_Surveyor_Description = 借鉴天问一号、火星勘测轨道器(MRO)、卡西尼号等多任务深空综合探测系统打造的旗舰级行星探测仪。针对地外天体引力与半径差异极大的痛点，特设全环境高度自适应调节架构：右键菜单中支持 0.1x~5.0x 连续高度缩放，并提供小天体(吉利/小行星)、中型天体(杜娜/月球)、巨型天体(朱尔)及自动自适应档位。集成高精雷达测高、生物群落与高精度矿产勘探于一体。

