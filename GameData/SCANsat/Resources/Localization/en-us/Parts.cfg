Localization
{
	en-us
	{
		#autoLOC_SCANsat_BTDT_Title			= SCAN Been There Done That®
		#autoLOC_SCANsat_BTDT_Description		= This small sensor can automatically identify nearby anomalies. Since it only works over very short distances and at very low altitudes, it's primarily useful to track identified anomalies that have been visited.

		#autoLOC_SCANsat_BTDT_Exo_Description 		= This model of scanning device contains a set of passive and active sensors designed to quickly hone in on interesting features located nearby. 

		#autoLOC_SCANsat_Multi_Title			= SCAN Multispectral Sensor
		#autoLOC_SCANsat_Multi_Description		= This multichannel sensor detects radiation across several infrared, visible light, and RADAR bands. This gives it the capability to differentiate between terrain types and biomes. It can also detect anomalies such as structures on the ground.

		#autoLOC_SCANsat_Radar_Title			= SCAN RADAR Altimetry Sensor
		#autoLOC_SCANsat_Radar_Description		= SCAN brings you this high performance RADAR altimetry sensor. This is the entry-level model in this sensor family, and commonly sold in a bundle with toy rockets and remote-controlled model planes. After focus group testing revealed that 95% of the target audience tried to duct tape it to the exhaust pipe of their rocket engines, this new and improved model has been made even easier to use.

		#autoLOC_SCANsat_SAR_Title			= SCAN SCAN SAR Altimetry Sensor
		#autoLOC_SCANsat_SAR_Description		= This Synthetic Aperture RADAR sensor uses its flight path to simulate a much larger antenna. This makes it possible to detect terrain elevation at much higher resolution. The downside is that its field of view is comparatively small, and it works better at higher altitudes.
		
		#autoLOC_SCANsat_Radar3B_Title				= R-3B Radar Altimeter
		#autoLOC_SCANsat_Radar3B_Description	= The high precision radar altimeter allows collection of basic elevation data in a very narrow swath below the satellite. Uses a moderate amount of power and functions in lit and unlit situations.
		
		#autoLOC_SCANsat_RadarEO_Title				= R-EO-1 Radar Antenna
		#autoLOC_SCANsat_RadarEO_Description	= This entry-level L-band radar altimeter collects low resolution elevation data at a medium swath from lower orbits. Uses a moderate amount of power and functions in lit and unlit situations.
	
		#autoLOC_SCANsat_SARX_Title				= SAR-X Antenna
		#autoLOC_SCANsat_SARX_Description	= A basic synthetic aperture radar instrument, which sends out radar signals and uses the movement of the satellite during the ping to synthesize recieving them with a much larger dish. Effectively captures high resolution elevation data over a very narraw width from low orbits. Uses a large amount of power but functions in lit and unlit situations.
		
		#autoLOC_SCANsat_SARC_Title				=  SAR-C Antenna
		#autoLOC_SCANsat_SARC_Description	= An advanced synthetic aperture radar instrument, which uses more power to operate at larger swaths and from higher altitudes. Effectively captures high resolution elevation data from medium orbits, but is restricted to a very narrow range of operation. Uses a large amount of power and functions in lit and unlit situations.
		
		#autoLOC_SCANsat_SARL_Title				= SAR-L Antenna
		#autoLOC_SCANsat_SARL_Description	= The most advanced synthetic aperture radar instrument, which uses a massive antenna to transmit and recieve multiple polarizations of radar energy. Can map large swaths of terrain from higher orbits, and due to the rich nature of the recieved data also map biomes. Uses a very large amount of power and functions in lit and unlit situations.
	
		#autoLOC_SCANsat_Multi_MS1_Title					= MS-1 Multispectral Scanner
		#autoLOC_SCANsat_Multi_MS1_Description		= This lower resolution multispectral scanner observes light reflected off a target's surface to deliver low-detail color and biome maps. Because of the entry-level components in this scanner model, it must be placed in lower orbits to operate effectively, and cannot be detect resources. Uses a small amount of power, and only operates in daylight.
		
		#autoLOC_SCANsat_Multi_MSR_Title					= MS-R Enhanced Multispectral Scanner
		#autoLOC_SCANsat_Multi_MSR_Description		= The enhanced multispectral scanner is a real jack of all trades, observing light reflected off a planet's surface and delivering low-detail colour images and biome maps. It can even detect surface resources. Improved optics and electronics allow effective operation at higher orbits compared to entry-level products, but only in a narrow swathe. Uses a small amount of power, and only operates in daylight.
		
		#autoLOC_SCANsat_Multi_MS2A_Title				= MS-2A Advanced Multispectral Scanner
		#autoLOC_SCANsat_Multi_MS2A_Description	= Examining the optical wavelengths in a number of spectral channels, the advanced scanner model produces low-detail colour images, biome maps and resource distributions. Uses a small amount of power, and only operates in daylight.
	
		#autoLOC_SCANsat_VS1_Title			= VS-1 High Resolution Imager
		#autoLOC_SCANsat_VS1_Description	= This entry-level observation telescope produces beautiful high detail colour images - from a low orbit only. Uses a small amount of power and functions only in lit situations.
	
		#autoLOC_SCANsat_VS3_Title			= VS-3 Advanced High Resolution Imager
		#autoLOC_SCANsat_VS3_Description = The pinnacle of Kerbal non-government high-resolution observation, this large and expensive imager produces high detail colour images and can identify unique surface features. Uses a small amount of power and functions only in lit situations.
	
		#autoLOC_SCANsat_VS11_Title			= VS-11 Classified Reconnaissance Imager
		#autoLOC_SCANsat_VS11_Description = The *REDACTED* can observe *REDACTED* targets every *REDACTED* from altitudes of *REDACTED* to *REDACTED*. Such amazing *REDACTED* have led *REDACTED* to speculate that *REDACTED* *REDACTED*. Uses a medium amount of power and functions only in lit situations.
	
		#autoLOC_SCANsat_R_Title					= SCAN-R Resource Mapper
		#autoLOC_SCANsat_R_Description		= An entry-level resource mapping instrument that works well at low orbital altitudes, though only scans over a very narrow width. Uses a moderate amount of power and functions only in lit situations.
	
		#autoLOC_SCANsat_R2_Title				= SCAN-R2 Advanced Resource Mapper
		#autoLOC_SCANsat_R2_Description 	= A medium-tech resource imager that can evaluate useful resources from higher orbits. Uses a moderate amount of power and functions only in lit situations.
	
		#autoLOC_SCANsat_RX_Title				= SCAN-RX Hyperspectral Resource Mapper
		#autoLOC_SCANsat_RX_Description	= A high-tech resource imager that captures hundreds of channels of data, to evaluate useful resource distributions from higher orbits. Uses a small amount of power and functions only in lit situations.
	
		// -------------------------------------------------------------
		// Instrument Expansion & Tunable Altitudes Localization
		// -------------------------------------------------------------
		#autoLOC_SCANsat_AltScale				= Altitude Scaling Multiplier
		#autoLOC_SCANsat_AltMode				= Body Adaptation Mode
		#autoLOC_SCANsat_AltMode_Default		= Default
		#autoLOC_SCANsat_AltMode_Minor			= Minor Body / Close
		#autoLOC_SCANsat_AltMode_Medium			= Medium Planet / Standard
		#autoLOC_SCANsat_AltMode_Giant			= Giant Planet / High
		#autoLOC_SCANsat_AltMode_Auto			= Auto-Adaptive

		// FengYun Series
		#autoLOC_SCANsat_FY4_AGRI_Title			= FY-4 AGRI Geostationary Radiation Imager
		#autoLOC_SCANsat_FY4_AGRI_Description	= Inspired by the Advanced Geostationary Radiation Imager (AGRI) on China's FengYun-4 meteorological satellites. Specifically designed for Geosynchronous Orbit (GEO), its ultra-wide field of view and high-resolution imaging capability enable 24/7 continuous day/night planetary observation from tens of thousands of kilometers up, generating crystal-clear high-definition visual imagery, biome classifications, and coarse resource data.
		
		#autoLOC_SCANsat_FY4_GIIRS_Title		= FY-4 GIIRS Geostationary Interferometric Sounder
		#autoLOC_SCANsat_FY4_GIIRS_Description	= Modeled after the world's first Geostationary Interferometric Infrared Sounder (GIIRS) on FengYun-4. Operating from GEO, it uses Fourier-transform interferometry across thousands of infrared channels to sound the atmosphere and surface, pinpointing high-detail geological and mineral resource signatures.
		
		#autoLOC_SCANsat_FY3_MERSI_Title		= FY-3 MERSI Medium Resolution Spectral Imager
		#autoLOC_SCANsat_FY3_MERSI_Description	= Based on the Medium Resolution Spectral Imager (MERSI) aboard FengYun-3 polar-orbiting meteorological satellites. Designed for Sun-Synchronous Polar Orbits (SSO), its rotating scan mirror delivers a sweeping swath width, rapidly providing global multispectral and biome coverage.
		
		#autoLOC_SCANsat_FY3_PMR_Title			= FY-3G PMR Precipitation Measurement Radar
		#autoLOC_SCANsat_FY3_PMR_Description	= Inspired by the dual-frequency active precipitation measurement phased-array radar on FengYun-3G. Flown in low-inclination or sun-synchronous orbits, it penetrates atmospheric cover to map precipitation profiles and high-resolution elevation topography. Functions in day or night.

		// Russian Meteor-M2 Series
		#autoLOC_SCANsat_Meteor_MSU_Title		= Meteor-M2 MSU-MR Multispectral Radiometer
		#autoLOC_SCANsat_Meteor_MSU_Description	= Inspired by the Multichannel Scanning Radiometer (MSU-MR) on Russia's Meteor-M2 polar meteorological satellites. Built for low and sun-synchronous orbits (SSO), it provides robust wide-swath multispectral and biome surveying.
		
		#autoLOC_SCANsat_Meteor_IKFS_Title		= Meteor-M2 IKFS-2 Fourier Infrared Spectrometer
		#autoLOC_SCANsat_Meteor_IKFS_Description = Based on the advanced Infrared Fourier Spectrometer (IKFS-2) on Meteor-M2. Measures hyperspectral surface and atmospheric emissions to provide high-detail resource distribution mapping. Requires daylight.
		
		#autoLOC_SCANsat_Severjanin_Title		= Meteor-M2 Severjanin-M Side-Looking SAR
		#autoLOC_SCANsat_Severjanin_Description	= Modeled after the Severjanin-M side-looking synthetic aperture radar on Meteor-M2. Designed for all-weather surface and polar ice cap mapping, providing high-resolution altimetry and biome surveys through clouds and darkness.

		// European MetOp Series
		#autoLOC_SCANsat_MetOp_AVHRR_Title		= MetOp AVHRR/3 Advanced Very High Resolution Radiometer
		#autoLOC_SCANsat_MetOp_AVHRR_Description = Based on the flight-proven AVHRR/3 multispectral radiometer on EUMETSAT's MetOp polar satellites. Delivers reliable visible, near-infrared, and thermal observations for surface biome and resource evaluation.
		
		#autoLOC_SCANsat_MetOp_ASCAT_Title		= MetOp ASCAT Advanced Scatterometer Radar
		#autoLOC_SCANsat_MetOp_ASCAT_Description = Inspired by the Advanced Scatterometer (ASCAT) on ESA's MetOp satellite. Employs multi-beam fan radar pulses to assess surface roughness, yielding altimetry and biome characteristics day and night.
		
		#autoLOC_SCANsat_MetOp_IASI_Title		= MetOp IASI Infrared Atmospheric Sounding Interferometer
		#autoLOC_SCANsat_MetOp_IASI_Description	= Based on the premier Infrared Atmospheric Sounding Interferometer (IASI) on MetOp, boasting 8,461 hyperspectral channels for premier resource and thermal signature analysis.

		// Synthetic Aperture Radar (SAR)
		#autoLOC_SCANsat_SkyMed_Title			= COSMO-SkyMed High-Resolution X-SAR Antenna
		#autoLOC_SCANsat_SkyMed_Description		= Based on Italy's COSMO-SkyMed X-band synthetic aperture radar constellation. Delivers high-precision geometric radar imaging and interferometry, generating high-resolution DEMs and detecting fine anomalies from low and polar orbits.
		
		#autoLOC_SCANsat_Sentinel1_Title		= Sentinel-1 C-SAR Advanced Radar
		#autoLOC_SCANsat_Sentinel1_Description	= Modeled after the C-SAR instrument on the Copernicus Sentinel-1 constellation. Features a deployable phased array antenna engineered for terrain interferometry (InSAR), providing high-resolution altimetry mapping across all planetary terrain.

		// Geological & Land Resources
		#autoLOC_SCANsat_GF5_AHSI_Title			= Gaofen-5 AHSI Advanced Hyperspectral Mineral Imager
		#autoLOC_SCANsat_GF5_AHSI_Description	= Inspired by the Advanced Hyperspectral Imager (AHSI) on China's Gaofen-5 satellite. Spans hundreds of narrow spectral bands from visible to shortwave infrared, specializing in mineral exploration and high-detail ore detection.
		
		#autoLOC_SCANsat_Landsat_OLI_Title		= Landsat 8/9 OLI-TIRS Operational Land & Thermal Imager
		#autoLOC_SCANsat_Landsat_OLI_Description = Based on the Operational Land Imager (OLI) and Thermal Infrared Sensor (TIRS) on Landsat 8 and 9. Combines multispectral optical and thermal channels to deliver high-resolution visual imagery, biomes, and resource distribution.
		
		#autoLOC_SCANsat_GF4_Stare_Title		= Gaofen-4 Geostationary High-Resolution Staring Camera
		#autoLOC_SCANsat_GF4_Stare_Description	= Modeled after China's Gaofen-4 geostationary Earth observation satellite. Operating from 36,000 km in GEO, it stares at planetary hemispheres with high magnification, pinpointing surface structures and visual anomalies.

		// Deep Space Planetary Adaptive Surveyor
		#autoLOC_SCANsat_DeepSpace_Surveyor_Title = 'Tianxun' Deep Space Adaptive Planetary Surveyor
		#autoLOC_SCANsat_DeepSpace_Surveyor_Description = Inspired by deep-space multi-instrument suites on Tianwen-1, MRO, and Cassini. Engineered to solve the challenge of scanning celestial bodies of drastically varying scales, featuring in-flight tunable altitude scaling (0.1x to 5.0x) and orbital presets (Minor Body, Medium Planet, Giant Planet, and Auto-Adaptive). Combines high-resolution radar altimetry, biome identification, and high-detail mineral resource detection in a single deployable package.
	}
}
